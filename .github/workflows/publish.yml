name: Test and publish Escape
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
  publish:
    if: github.event_name != 'pull_request'
    needs: test
    uses: jehyunlee/apps/.github/workflows/publish-app.yml@main
    with:
      app: escape
      revision: ${{ github.sha }}
    secrets:
      APPS_DEPLOY_KEY: ${{ secrets.APPS_DEPLOY_KEY }}
